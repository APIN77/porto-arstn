      </text>
      <rect x="20" y="180" width="130" height="26" rx="13" fill="#FFFFFF" stroke="#0052FF" stroke-width="1"/>
      <text x="85" y="197" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#0052FF" text-anchor="middle">CRITICAL DAMPING</text>

      <!-- Card 2: Editorial Typography & Color Balance -->
      <rect x="336" y="0" width="310" height="230" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="356" y="20" width="40" height="40" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
      <rect x="368" y="32" width="16" height="16" rx="4" fill="#0052FF"/>
      <text x="356" y="86" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="800" fill="#0052FF" letter-spacing="0.04em">PALET IDENTITAS</text>
      <text x="356" y="112" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="17" font-weight="800" fill="#0A0F1D">Putih &amp; Royal Blue</text>
      <text x="356" y="136" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="500" fill="#475569">
        Kontras terstandar WCAG AA (>4.5:1), tipografi geometris Plus Jakarta Sans &amp; Inter.
      </text>
      <g transform="translate(356, 178)">
        <rect x="0" y="0" width="60" height="28" rx="8" fill="#0052FF"/>
        <text x="30" y="18" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">#0052FF</text>
        <rect x="68" y="0" width="60" height="28" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <text x="98" y="18" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="700" fill="#0A0F1D" text-anchor="middle">#FFFFFF</text>
      </g>

      <!-- Card 3: Modern Tech Stack -->
      <rect x="672" y="0" width="312" height="230" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="692" y="20" width="40" height="40" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
      <polygon points="712,28 724,48 700,48" fill="#0052FF"/>
      <text x="692" y="86" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="800" fill="#0052FF" letter-spacing="0.04em">ARSITEKTUR FRONTEND</text>
      <text x="692" y="112" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="17" font-weight="800" fill="#0A0F1D">Modern Web Engine</text>
      <text x="692" y="136" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="500" fill="#475569">
        Next.js App Router, Tailwind CSS, TypeScript, Framer Motion, dan integrasi i18n dwibahasa.
      </text>
      <g transform="translate(692, 178)">
        <rect x="0" y="0" width="80" height="26" rx="13" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
        <text x="40" y="17" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700" fill="#0052FF" text-anchor="middle">Next.js 14</text>
        <rect x="88" y="0" width="85" height="26" rx="13" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
        <text x="130" y="17" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700" fill="#0052FF" text-anchor="middle">TypeScript</text>
        <rect x="180" y="0" width="85" height="26" rx="13" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
        <text x="222" y="17" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700" fill="#0052FF" text-anchor="middle">Tailwind</text>
      </g>
