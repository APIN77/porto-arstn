        <polygon points="110,0 160,25 160,100 110,80" fill="#2563EB" stroke="#1D4ED8" stroke-width="1.5"/>
        <polygon points="40,20 110,0 160,25 90,45" fill="#60A5FA" stroke="#3B82F6" stroke-width="1.5"/>
        <text x="75" y="75" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">3D CUBE</text>
      </g>
    </g>

    <!-- 3 Bento Feature Highlights -->
    <g transform="translate(48, 360)">
      <!-- Card 1: Interactive Physics & Wordmark -->
      <rect x="0" y="0" width="310" height="230" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="20" y="20" width="40" height="40" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
      <circle cx="40" cy="40" r="10" fill="#0052FF"/>
      <text x="20" y="86" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="800" fill="#0052FF" letter-spacing="0.04em">GEOMETRI INTERAKTIF</text>
      <text x="20" y="112" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="17" font-weight="800" fill="#0A0F1D">Dynamic Stretch Hero</text>
      <text x="20" y="136" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="500" fill="#475569">
