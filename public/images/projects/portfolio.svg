  <g opacity="0.18" fill="#FFFFFF">
    <circle cx="80" cy="80" r="2.5"/><circle cx="160" cy="80" r="2.5"/><circle cx="240" cy="80" r="2.5"/><circle cx="320" cy="80" r="2.5"/><circle cx="400" cy="80" r="2.5"/><circle cx="480" cy="80" r="2.5"/><circle cx="560" cy="80" r="2.5"/><circle cx="640" cy="80" r="2.5"/><circle cx="720" cy="80" r="2.5"/><circle cx="800" cy="80" r="2.5"/><circle cx="880" cy="80" r="2.5"/><circle cx="960" cy="80" r="2.5"/><circle cx="1040" cy="80" r="2.5"/><circle cx="1120" cy="80" r="2.5"/>
    <circle cx="80" cy="180" r="2.5"/><circle cx="160" cy="180" r="2.5"/><circle cx="240" cy="180" r="2.5"/><circle cx="320" cy="180" r="2.5"/><circle cx="400" cy="180" r="2.5"/><circle cx="480" cy="180" r="2.5"/><circle cx="560" cy="180" r="2.5"/><circle cx="640" cy="180" r="2.5"/><circle cx="720" cy="180" r="2.5"/><circle cx="800" cy="180" r="2.5"/><circle cx="880" cy="180" r="2.5"/><circle cx="960" cy="180" r="2.5"/><circle cx="1040" cy="180" r="2.5"/><circle cx="1120" cy="180" r="2.5"/>
    <circle cx="80" cy="280" r="2.5"/><circle cx="160" cy="280" r="2.5"/><circle cx="240" cy="280" r="2.5"/><circle cx="320" cy="280" r="2.5"/><circle cx="400" cy="280" r="2.5"/><circle cx="480" cy="280" r="2.5"/><circle cx="560" cy="280" r="2.5"/><circle cx="640" cy="280" r="2.5"/><circle cx="720" cy="280" r="2.5"/><circle cx="800" cy="280" r="2.5"/><circle cx="880" cy="280" r="2.5"/><circle cx="960" cy="280" r="2.5"/><circle cx="1040" cy="280" r="2.5"/><circle cx="1120" cy="280" r="2.5"/>
    <circle cx="80" cy="380" r="2.5"/><circle cx="160" cy="380" r="2.5"/><circle cx="240" cy="380" r="2.5"/><circle cx="320" cy="380" r="2.5"/><circle cx="400" cy="380" r="2.5"/><circle cx="480" cy="380" r="2.5"/><circle cx="560" cy="380" r="2.5"/><circle cx="640" cy="380" r="2.5"/><circle cx="720" cy="380" r="2.5"/><circle cx="800" cy="380" r="2.5"/><circle cx="880" cy="380" r="2.5"/><circle cx="960" cy="380" r="2.5"/><circle cx="1040" cy="380" r="2.5"/><circle cx="1120" cy="380" r="2.5"/>
    <circle cx="80" cy="480" r="2.5"/><circle cx="160" cy="480" r="2.5"/><circle cx="240" cy="480" r="2.5"/><circle cx="320" cy="480" r="2.5"/><circle cx="400" cy="480" r="2.5"/><circle cx="480" cy="480" r="2.5"/><circle cx="560" cy="480" r="2.5"/><circle cx="640" cy="480" r="2.5"/><circle cx="720" cy="480" r="2.5"/><circle cx="800" cy="480" r="2.5"/><circle cx="880" cy="480" r="2.5"/><circle cx="960" cy="480" r="2.5"/><circle cx="1040" cy="480" r="2.5"/><circle cx="1120" cy="480" r="2.5"/>
    <circle cx="80" cy="580" r="2.5"/><circle cx="160" cy="580" r="2.5"/><circle cx="240" cy="580" r="2.5"/><circle cx="320" cy="580" r="2.5"/><circle cx="400" cy="580" r="2.5"/><circle cx="480" cy="580" r="2.5"/><circle cx="560" cy="580" r="2.5"/><circle cx="640" cy="580" r="2.5"/><circle cx="720" cy="580" r="2.5"/><circle cx="800" cy="580" r="2.5"/><circle cx="880" cy="580" r="2.5"/><circle cx="960" cy="580" r="2.5"/><circle cx="1040" cy="580" r="2.5"/><circle cx="1120" cy="580" r="2.5"/>
    <circle cx="80" cy="680" r="2.5"/><circle cx="160" cy="680" r="2.5"/><circle cx="240" cy="680" r="2.5"/><circle cx="320" cy="680" r="2.5"/><circle cx="400" cy="680" r="2.5"/><circle cx="480" cy="680" r="2.5"/><circle cx="560" cy="680" r="2.5"/><circle cx="640" cy="680" r="2.5"/><circle cx="720" cy="680" r="2.5"/><circle cx="800" cy="680" r="2.5"/><circle cx="880" cy="680" r="2.5"/><circle cx="960" cy="680" r="2.5"/><circle cx="1040" cy="680" r="2.5"/><circle cx="1120" cy="680" r="2.5"/>
