  <!-- Main Showcase Browser Window -->
  <g filter="url(#pCardShadow)" transform="translate(60, 45)">
    <rect width="1080" height="660" rx="22" fill="#FFFFFF" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>

    <!-- Browser Header Bar -->
    <path d="M 0 22 A 22 22 0 0 1 22 0 L 1058 0 A 22 22 0 0 1 1080 22 L 1080 56 L 0 56 Z" fill="#F8FAFC"/>
    <line x1="0" y1="56" x2="1080" y2="56" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Window Dots -->
    <circle cx="32" cy="28" r="6" fill="#EF4444"/>
    <circle cx="52" cy="28" r="6" fill="#F59E0B"/>
    <circle cx="72" cy="28" r="6" fill="#10B981"/>

    <!-- URL Bar Pill -->
