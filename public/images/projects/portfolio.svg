      <rect width="984" height="42" rx="21" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="12" y="7" width="94" height="28" rx="14" fill="#0052FF"/>
      <text x="59" y="25" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">ARSTN ©2026</text>

      <text x="320" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">TENTANG</text>
      <text x="420" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">KEAHLIAN</text>
      <text x="520" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800" fill="#0052FF">KARYA</text>
      <text x="610" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">KONTAK</text>

      <rect x="876" y="8" width="96" height="26" rx="13" fill="#FFFFFF" stroke="#0052FF" stroke-width="1.5"/>
      <text x="924" y="25" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="800" fill="#0052FF" text-anchor="middle">TERSEDIA • ID/EN</text>
    </g>

    <!-- Hero Kinetic Letters Rendering (ARSTN) -->
    <g transform="translate(48, 145)">
      <rect width="984" height="190" rx="18" fill="url(#pCardGrad)" stroke="#E2E8F0" stroke-width="1"/>
      
      <!-- Stretched SVG Outlines for ARSTN letters -->
      <!-- A -->
      <path d="M 90 160 L 90 55 L 145 55 L 145 160 M 90 105 L 145 105" stroke="#0052FF" stroke-width="18" stroke-linecap="square" fill="none"/>
      <!-- R -->
      <path d="M 195 160 L 195 55 L 250 55 C 265 55 265 105 250 105 L 195 105 M 235 105 L 260 160" stroke="#0052FF" stroke-width="18" stroke-linecap="square" fill="none"/>
      <!-- S -->
      <path d="M 370 70 C 370 55 310 55 310 90 C 310 135 370 120 370 150 C 370 170 310 170 310 150" stroke="#0052FF" stroke-width="18" stroke-linecap="square" fill="none"/>
      <!-- T -->
      <path d="M 420 55 L 490 55 M 455 55 L 455 160" stroke="#0052FF" stroke-width="18" stroke-linecap="square" fill="none"/>
      <!-- N -->
      <path d="M 540 160 L 540 55 L 610 160 L 610 55" stroke="#0052FF" stroke-width="18" stroke-linecap="square" fill="none"/>

      <!-- 3D Illustrated Carton Box in Hero -->
      <g transform="translate(800, 30)">
